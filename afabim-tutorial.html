<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFABIM 教學影片中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6fb;
    --bg-soft:#ffffff;
    --ink:#1c2333;
    --ink-soft:#5b6478;
    --border:#e4e8f1;
    --accent:#3457d5;
    --accent-soft:#eaefff;
    --shadow:0 10px 30px -12px rgba(28,35,51,0.15);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
    line-height:1.5;
  }
  a{color:inherit;text-decoration:none;}

  /* ---------- Hero ---------- */
  .hero{
    background:radial-gradient(1200px 500px at 15% -20%, #3457d5 0%, #1c2b6b 55%, #10173a 100%);
    color:#fff;
    padding:56px 24px 72px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-120px;top:-120px;
    width:380px;height:380px;
    background:radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 70%);
  }
  .hero-inner{max-width:1120px;margin:0 auto;position:relative;}
  .hero-badge{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    padding:6px 14px;border-radius:999px;
    font-size:13px;font-weight:500;
    margin-bottom:18px;
  }
  .hero-badge .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,0.25);}
  .hero h1{
    font-size:clamp(28px,4vw,42px);
    font-weight:900;
    margin:0 0 12px;
    letter-spacing:-0.02em;
  }
  .hero p.lead{
    font-size:16px;
    color:rgba(255,255,255,0.82);
    max-width:640px;
    margin:0 0 26px;
  }
  .notice{
    display:flex;gap:12px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:14px;
    padding:16px 18px;
    max-width:640px;
    backdrop-filter:blur(4px);
  }
  .notice svg{flex:none;margin-top:2px;}
  .notice .t{font-weight:700;font-size:14px;margin-bottom:4px;}
  .notice .d{font-size:13.5px;color:rgba(255,255,255,0.78);}

  /* ---------- Controls ---------- */
  .controls-wrap{
    max-width:1120px;
    margin:-38px auto 0;
    padding:0 24px;
    position:relative;
    z-index:2;
  }
  .controls{
    background:var(--bg-soft);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    padding:18px;
  }
  .search-box{
    position:relative;
    margin-bottom:14px;
  }
  .search-box svg{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    color:var(--ink-soft);
  }
  .search-box input{
    width:100%;
    padding:13px 16px 13px 44px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:#f9fafc;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    outline:none;
    transition:border-color .15s, background .15s;
  }
  .search-box input:focus{border-color:var(--accent);background:#fff;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1.5px solid var(--border);
    background:#fff;
    color:var(--ink-soft);
    padding:8px 14px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:all .15s;
    font-family:inherit;
  }
  .chip .swatch{width:8px;height:8px;border-radius:50%;background:currentColor;}
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  .chip.active .swatch{background:#fff;}
  .chip .count{
    background:rgba(0,0,0,0.06);
    border-radius:999px;
    padding:1px 7px;
    font-size:11.5px;
  }
  .chip.active .count{background:rgba(255,255,255,0.2);}

  /* ---------- Grid ---------- */
  main{max-width:1120px;margin:0 auto;padding:34px 24px 80px;}
  .section-title{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:0 0 16px;
  }
  .section-title h2{font-size:15px;color:var(--ink-soft);font-weight:600;margin:0;}
  .section-title span{font-size:13px;color:var(--ink-soft);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:16px;
  }
  .card{
    background:var(--bg-soft);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:14px;
    box-shadow:0 1px 2px rgba(16,23,58,0.04);
    transition:transform .15s, box-shadow .15s, border-color .15s;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 14px 28px -14px rgba(16,23,58,0.22);
    border-color:transparent;
  }
  .card .tag{
    display:inline-flex;align-items:center;gap:6px;
    align-self:flex-start;
    font-size:11.5px;
    font-weight:700;
    padding:4px 10px 4px 8px;
    border-radius:999px;
  }
  .card .tag .swatch{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .card h3{
    margin:0;
    font-size:16.5px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  .card .btn{
    margin-top:auto;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 14px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:700;
    background:var(--accent);
    color:#fff;
    transition:background .15s, transform .1s;
  }
  .card .btn:hover{background:#2543b0;}
  .card .btn:active{transform:scale(0.98);}
  .card.disabled{opacity:0.55;}
  .card .btn.disabled{
    background:#eef0f5;
    color:var(--ink-soft);
    cursor:default;
    pointer-events:none;
  }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty h3{color:var(--ink);margin-bottom:6px;}

  footer{
    border-top:1px solid var(--border);
    padding:26px 24px 40px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }
  footer a{color:var(--accent);font-weight:600;}

  @media (max-width:600px){
    .hero{padding:40px 16px 64px;}
    .controls-wrap{padding:0 14px;}
    main{padding:28px 14px 60px;}
    .grid{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:420px){
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-badge"><span class="dot"></span> Web 版工具導覽 · 免安裝</div>
    <h1>AFABIM 教學影片中心</h1>
    <p class="lead">把原本的 afabim教學.exe 啟動器搬到網頁上。點選下方任一功能，直接跳轉到對應的 YouTube 教學影片，操作方式完全相同。</p>
    <div class="notice">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <div>
        <div class="t">為什麼改成網頁版？</div>
        <div class="d">部分防毒軟體會把 afabim教學.exe 誤判為疑似病毒，造成下載上的困擾。這個網頁不需要下載執行檔，點擊按鈕就能直接觀看教學影片，安全也更方便更新。</div>
      </div>
    </div>
  </div>
</div>

<div class="controls-wrap">
  <div class="controls">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" id="searchInput" placeholder="搜尋功能名稱，例如：dwg block、面積、篩選...">
    </div>
    <div class="chips" id="chipRow"></div>
  </div>
</div>

<main>
  <div class="section-title">
    <h2 id="resultLabel">全部功能</h2>
    <span id="resultCount"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <h3>找不到符合的功能</h3>
    <div>換個關鍵字，或選擇「全部」看看所有分類。</div>
  </div>
</main>

<footer>
  AFABIM 教學影片中心 · 資料來源 <a href="https://github.com/afabim/afabim-office" target="_blank" rel="noopener">afabim/afabim-office</a>
</footer>

<script>
// ---------- 分類設定（顏色沿用 exe 分頁 B~F） ----------
const CATEGORIES = [
  { key: "B-門窗",        color: "#2563eb" },
  { key: "C-面積",        color: "#0ea5a4" },
  { key: "D-製圖2D元件",  color: "#7c3aed" },
  { key: "E-製圖3D元件",  color: "#ea580c" },
  { key: "F-補助工具",    color: "#db2777" },
];

// ---------- 資料：由 afabim教學.txt 轉換而來 ----------
const ITEMS = [
  { cat:"B-門窗", name:"門窗大樣", url:"https://youtu.be/eMP2ahnx0TM" },
  { cat:"B-門窗", name:"門窗編號", url:"https://youtu.be/u5ulxbfGlu8" },

  { cat:"C-面積", name:"一點面積", url:"https://youtu.be/KP9ZcXjZaCg" },
  { cat:"C-面積", name:"繞牆面積", url:"https://youtu.be/STVVn9pPm60" },
  { cat:"C-面積", name:"計算機", url:"https://youtu.be/08OrdkgL4g4" },
  { cat:"C-面積", name:"excel2revit", url:"https://youtu.be/KTkMjqk6yeg" },
  { cat:"C-面積", name:"選數字替換數字", url:"https://youtu.be/4Jm0DHCCVGg" },
  { cat:"C-面積", name:"計算式重算", url:"https://youtu.be/4Jm0DHCCVGg" },
  { cat:"C-面積", name:"選數字-sum", url:"https://youtu.be/4Jm0DHCCVGg" },
  { cat:"C-面積", name:"選TX剪貼簿", url:"https://youtu.be/KTkMjqk6yeg" },
  { cat:"C-面積", name:"排間分戶面積", url:"https://youtu.be/UpBLJSbsFqU" },
  { cat:"C-面積", name:"送照樓板面積計算式", url:"https://youtu.be/x_im_LM4nf8" },
  { cat:"C-面積", name:"重作房間分隔線", url:"https://youtu.be/ZuZwxZxS3tY" },

  { cat:"D-製圖2D元件", name:"dwg block", url:"https://youtu.be/WtcBCrkYuqg" },
  { cat:"D-製圖2D元件", name:"rfa data", url:"https://youtu.be/mCXjlyd5WDs" },
  { cat:"D-製圖2D元件", name:"rvt data", url:"https://youtu.be/_LEzYrwT82U" },
  { cat:"D-製圖2D元件", name:"兩點值", url:"https://youtu.be/08OrdkgL4g4" },
  { cat:"D-製圖2D元件", name:"替換文字", url:"https://youtu.be/bt6uKxHvG6Y" },
  { cat:"D-製圖2D元件", name:"步行距離", url:"https://youtu.be/FkGpB9CblWY" },
  { cat:"D-製圖2D元件", name:"用詞插入替換", url:"https://youtu.be/t7NzsiB0GlQ" },
  { cat:"D-製圖2D元件", name:"牆柱心尺寸線", url:"https://youtu.be/VwFkyAEANEI" },
  { cat:"D-製圖2D元件", name:"編號插入", url:"https://youtu.be/ojPG9u67jV0" },

  { cat:"E-製圖3D元件", name:"3DBox", url:"https://youtu.be/-bdKc6gKYQA" },
  { cat:"E-製圖3D元件", name:"3D該樓層", url:"https://youtu.be/-bdKc6gKYQA" },
  { cat:"E-製圖3D元件", name:"Column選創", url:"https://youtu.be/CqWnhKgJLVs" },
  { cat:"E-製圖3D元件", name:"柱-翻模", url:"https://youtu.be/CqWnhKgJLVs" },
  { cat:"E-製圖3D元件", name:"Beam選創", url:"https://youtu.be/YNQg73CDLeU"},
  { cat:"E-製圖3D元件", name:"Wall選創", url:"https://youtu.be/SNM6XcVIlqM" },
  { cat:"E-製圖3D元件", name:"WIN選創", url:"https://youtu.be/J-Cch00PhCo" },
  { cat:"E-製圖3D元件", name:"創建樓板", url:"https://youtu.be/dxIjFw-_Ij0" },
  { cat:"E-製圖3D元件", name:"自動上樑", url:"https://youtu.be/fp9k8u6CgkM" },
  { cat:"E-製圖3D元件", name:"牆到樑版底", url:"https://youtu.be/ZcwW2X5nz6Q" },

  { cat:"F-補助工具", name:"Groupblk", url:"https://youtu.be/CcQVo8E453k" },
  { cat:"F-補助工具", name:"HideUhide", url:"https://youtu.be/6uNiCcv6XbI" },
  { cat:"F-補助工具", name:"move原點", url:"https://youtu.be/sjeZeAafY_g" },
  { cat:"F-補助工具", name:"split柱中牆", url:"https://youtu.be/sjeZeAafY_g" },
  { cat:"F-補助工具", name:"一點放大", url:"https://youtu.be/w2oPQ9fH9cE" },
  { cat:"F-補助工具", name:"法規網址", url:"https://youtu.be/t7NzsiB0GlQ" },
  { cat:"F-補助工具", name:"背景黑白", url:"https://youtu.be/w2oPQ9fH9cE" },
  { cat:"F-補助工具", name:"參考線 半透明", url:"https://youtu.be/w2oPQ9fH9cE" },
  { cat:"F-補助工具", name:"變顏色", url:"https://youtu.be/RcQlsk-8zYs" },
  { cat:"F-補助工具", name:"Copy顏色", url:"https://youtu.be/CDMlXlIlFzQ" },
  { cat:"F-補助工具", name:"防火開口3m2", url:"https://youtu.be/CDMlXlIlFzQ" },
  { cat:"F-補助工具", name:"篩選", url:"https://youtu.be/6uNiCcv6XbI" },
  { cat:"F-補助工具", name:"HideUhide", url:"https://youtu.be/6uNiCcv6XbI" },
  { cat:"F-補助工具", name:"樓高設定", url:"https://youtu.be/XhWHJctRL44" },
];

const colorOf = cat => (CATEGORIES.find(c => c.key === cat) || {}).color || "#3457d5";

let activeCat = "全部";
let query = "";

const chipRow = document.getElementById("chipRow");
const grid = document.getElementById("grid");
const emptyState = document.getElementById("emptyState");
const resultLabel = document.getElementById("resultLabel");
const resultCount = document.getElementById("resultCount");
const searchInput = document.getElementById("searchInput");

function buildChips(){
  const all = [{ key:"全部", color:"#1c2333" }, ...CATEGORIES];
  chipRow.innerHTML = all.map(c => {
    const count = c.key === "全部" ? ITEMS.length : ITEMS.filter(i => i.cat === c.key).length;
    return `<button class="chip${c.key===activeCat ? ' active':''}" data-cat="${c.key}" style="color:${c.key===activeCat?'':c.color}">
      <span class="swatch" style="color:${c.color}"></span>${c.key}<span class="count">${count}</span>
    </button>`;
  }).join("");
  chipRow.querySelectorAll(".chip").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      activeCat = btn.dataset.cat;
      render();
    });
  });
}

function render(){
  buildChips();
  const q = query.trim().toLowerCase();
  const filtered = ITEMS.filter(i=>{
    const matchesCat = activeCat === "全部" || i.cat === activeCat;
    const matchesQuery = !q || i.name.toLowerCase().includes(q) || i.cat.toLowerCase().includes(q);
    return matchesCat && matchesQuery;
  });

  resultLabel.textContent = activeCat === "全部" ? "全部功能" : activeCat;
  resultCount.textContent = `共 ${filtered.length} 項`;

  if(filtered.length === 0){
    grid.style.display = "none";
    emptyState.style.display = "block";
    return;
  }
  grid.style.display = "grid";
  emptyState.style.display = "none";

  grid.innerHTML = filtered.map(i=>{
    const color = colorOf(i.cat);
    const hasUrl = !!i.url;
    return `
      <div class="card${hasUrl?'':' disabled'}">
        <span class="tag" style="background:${color}1a;color:${color}"><span class="swatch"></span>${i.cat}</span>
        <h3>${i.name}</h3>
        ${hasUrl
          ? `<a class="btn" href="${i.url}" target="_blank" rel="noopener">
               <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
               觀看教學影片
             </a>`
          : `<span class="btn disabled">教學影片籌備中</span>`
        }
      </div>`;
  }).join("");
}

searchInput.addEventListener("input", (e)=>{
  query = e.target.value;
  render();
});

render();
</script>
</body>
</html>
